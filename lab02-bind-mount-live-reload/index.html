<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Bind Mount Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
      padding-top: 80px;
    }
    .card {
      background: #1e293b;
      display: inline-block;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    h1 { color: #38bdf8; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 16px; }
    code { background: #0f172a; padding: 4px 8px; border-radius: 6px; color: #34d399; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Live Mount Demo (Version 1.0)</h1>
    <p>This file is served by Nginx inside Docker, but hosted on your physical disk!</p>
    <p>Edit <code>index.html</code> on your laptop and hit <strong>Refresh</strong> in your browser.</p>
  </div>
</body>
</html>
