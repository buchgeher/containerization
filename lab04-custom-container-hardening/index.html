<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RaaS Gateway</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 60px 20px;
    }
    .badge {
      display: inline-block;
      background: #0284c7;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
    }
    h1 { color: #38bdf8; font-size: 32px; margin: 10px 0; }
    p { color: #94a3b8; font-size: 16px; max-width: 500px; margin: 0 auto 30px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #1e293b;
      padding: 10px 20px;
      border-radius: 10px;
      border: 1px solid #334155;
      font-mono;
      color: #10b981;
    }
  </style>
</head>
<body>
  <div class="badge">Robotics as a Service (RaaS)</div>
  <h1>🤖 Edge Gateway Node</h1>
  <p>Production-hardened containerized gateway component for autonomous mobile robot telemetry.</p>
  <div class="status">
    <span>●</span> Status: Online &amp; Non-Root Verified
  </div>
</body>
</html>
